spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${IAM_DB_PORT:9544}/db_iam_service}
    username: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changes/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:9000}

app:
  iam:
    # Offline lookup only; blank keeps public-IP locations unavailable.
    geoip-database: ${IAM_GEOIP_DATABASE:}
    mail-from: ${IAM_MAIL_FROM:no-reply@localhost}
    issuer: ${IAM_ISSUER:http://localhost:9000}
    signing-key-file: ${IAM_SIGNING_KEY_FILE:.local/iam-signing-key.json}
    clients:
      oidc:
        id: ${IAM_OIDC_CLIENT_ID:iam-web-client}
        secret: ${IAM_OIDC_CLIENT_SECRET}
        scopes: [openid, profile, email, phone, address]
        redirect-uris:
          - ${IAM_OIDC_REDIRECT_URI:http://localhost:8081/login/oauth2/code/iam}
          - https://oauth.pstmn.io/v1/browser-callback
          - https://oauth.pstmn.io/v1/callback
        logout-redirect-uris:
          - ${IAM_OIDC_LOGOUT_URI:http://localhost:8081/}
      services:
        - id: ${IAM_DCR_CLIENT_ID:iam-registration}
          secret: ${IAM_DCR_CLIENT_SECRET}
          scopes: [client.create]
    token:
      audience-rules:
        - any-scopes: [openid, profile, email, phone, address]
          audiences: [iam-api]

# Swagger uses a public, PKCE-only client; no client secret is exposed in the UI.
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: false
    oauth:
      client-id: iam-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid,profile,email

# Scalar shares the existing OpenAPI document and JWT bearer security scheme.
scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: ISTAD IAM API Reference
