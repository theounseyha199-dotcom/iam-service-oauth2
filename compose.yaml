name: istad-iam-review
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - iam-review-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [local]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - iam-review-mail:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
  postgres:
    image: postgres:18.4
    ports:
      - "127.0.0.1:${IAM_DB_PORT:-9544}:5432"
    environment:
      POSTGRES_DB: db_iam_service
      POSTGRES_USER: iteuser
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Export DB_PASSWORD before starting PostgreSQL}"
    volumes:
      - iam-review-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iteuser -d db_iam_service"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  iam-review-redis:
  iam-review-mail:
  iam-review-postgres:
