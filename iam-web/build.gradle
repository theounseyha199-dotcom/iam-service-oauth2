plugins {
    id 'spring-common-conventions'
    id 'com.github.node-gradle.node' version '7.1.0'
}
dependencies {
    implementation project(':iam-domain:iam-application-service')
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
}

repositories {
    mavenCentral()
}

def reactDirectory = layout.projectDirectory.dir('iam-web-reactjs')

node {
    version = '26.13.0'
    download = true
    nodeProjectDir = reactDirectory
    npmInstallCommand = 'ci'
}

tasks.register('buildReact', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.files(fileTree(reactDirectory.dir('src')), fileTree(reactDirectory.dir('public')))
    inputs.files(reactDirectory.file('package.json'), reactDirectory.file('package-lock.json'),
            reactDirectory.file('vite.config.js'), reactDirectory.file('index.html'))
    outputs.dir(reactDirectory.dir('dist'))
}

tasks.named('processResources') {
    dependsOn tasks.named('buildReact')
    from(reactDirectory.dir('dist')) {
        into 'static/react'
    }
}

// Keep frontend validation in the normal Gradle verification lifecycle.
tasks.register('lintReact', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'lint']
}

tasks.named('check') {
    dependsOn tasks.named('lintReact')
}

// Exercise schema boundaries and translation resources in the normal check lifecycle.
tasks.register('testReactForms', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'test:forms']
}

tasks.named('check') {
    dependsOn tasks.named('testReactForms')
}
